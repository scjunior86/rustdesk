name: Build RustDesk Windows x64
permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ scjunior86-custom ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full source + submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Show env info
        run: |
          rustc --version
          cargo --version
          flutter --version
        shell: pwsh

      - name: Run official build-windows.ps1
        run: |
          cd flutter
          .\build-windows.ps1
        shell: pwsh # 关键修复：强制使用pwsh，解决ps1脚本执行报错！

      - name: Upload unsigned Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-win64-custom
          path: flutter/build/windows/x64/runner/Release/
